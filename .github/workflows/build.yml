name: Build Resume

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile Resume
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t akhilxavier-resume .

      - name: Compile LaTeX
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            akhilxavier-resume \
            pdflatex \
              -interaction=nonstopmode \
              -halt-on-error \
              akhilxavier-resume.tex

      - name: Compile LaTeX (second pass)
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            akhilxavier-resume \
            pdflatex \
              -interaction=nonstopmode \
              -halt-on-error \
              akhilxavier-resume.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: akhilxavier-resume
          path: akhilxavier-resume.pdf
          if-no-files-found: error

